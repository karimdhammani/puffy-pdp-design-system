name: check

# The system is reconciled three ways: the live puffy.com PDP is the source of
# truth, Figma supplies naming and intent, and system/*.css is the
# implementation. Every push re-checks that the generated token JSON is current,
# that all 22 Figma text styles still match the library metrics, and that the
# colour primitives still match what the live site serves.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    name: reconciled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-tokens.js
